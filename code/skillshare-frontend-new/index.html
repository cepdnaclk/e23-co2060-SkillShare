<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillShare</title>
    <meta name="description" content="Everyone can teach. Everyone can learn." />
    <meta name="author" content="Zenware" />

    <meta property="og:title" content="SkillShare" />
    <meta property="og:description" content="Everyone can teach. Everyone can learn." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://skillshare-topaz-delta.vercel.app/opengraph-image-p98pqg.png" />

    <link rel="icon" type="image/png" href="/skillshare.png" />
    <link rel="apple-touch-icon" href="/skillshare.png" />

    <!-- Inter font — preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('skillshare-theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) || saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
