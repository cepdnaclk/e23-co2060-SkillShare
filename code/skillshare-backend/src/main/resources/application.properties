spring.application.name=skillshare-backend

# --- Database Configuration ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# --- Custom JWT Configuration ---
jwt.secret=${JWT_SECRET}

# Hibernate Configuration
# LOGIC: 'update' is great for development as it adds new columns automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson: serialize LocalDateTime as ISO-8601 string, not a numeric array ---
# Without this, LocalDateTime serializes as [2024, 1, 15, 10, 30, 5] which breaks
# all date parsing on the frontend (new Date() returns Invalid Date on an array).
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Bot ON/OFF Switch
demo.bot.enabled=false
spring.config.import=optional:file:.env