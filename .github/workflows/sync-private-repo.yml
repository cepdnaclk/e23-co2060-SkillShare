name: Sync to Private Repository

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync main to private repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout organization repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push to private repository
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add private "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/poornamg/e23-co2060-SkillShare.git"

          git push private main:main
